# Fallback für XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Nur nötig, falls sich BoulderPlan.xcodeproj nicht öffnen lässt (z. B. Xcode < 16):
#   brew install xcodegen
#   xcodegen generate
name: BoulderPlan
options:
  bundleIdPrefix: de.boulderplan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  BoulderPlan:
    type: application
    platform: iOS
    sources:
      - path: BoulderPlan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.boulderplan.BoulderPlan
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Boulder Plan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
